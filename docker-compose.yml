services:
  postgres:
    image: postgres:16
    env_file: .env
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
  kafka:
    image: apache/kafka:3.8.0
    ports: ["9092:9092"]
  minio:
    image: minio/minio:latest
    env_file: .env
    command: server /data --console-address ":9001"
    ports: ["9000:9000", "9001:9001"]
  # Services suivants à compléter : connect, spark, airflow, superset, mlflow,
  # prometheus et grafana.

volumes:
  postgres_data:
