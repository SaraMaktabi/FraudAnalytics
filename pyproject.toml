[project]
name = "fraudanalytics"
version = "0.1.0"
description = "Plateforme Big Data de détection de fraude bancaire"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ijson>=3.6.0",
    "pandas>=3.1.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
